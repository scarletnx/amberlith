name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version's release (publish.yml)
  pull_request:
  workflow_dispatch:

# Jobs only read the repository. A push to main that builds becomes a nightly, a version tag a release: publish.yml
# does it once this workflow ends. A pull request's builds stay its run's artifacts, linked from it (links below)
permissions:
  contents: read

# A pull request's newer push cancels the build of the one it replaced, which would only hold a runner; a push to main
# and a tag are never cancelled, each its own nightly or release
concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The NRO in devkitPro's container, pinned by its tag and its digest so every build uses one toolchain:
  # devkitA64 r29.2 (GCC 15.2), libnx 4.12.0, deko3d 0.5.0, uam 1.1.0, switch-tools 1.13.1. A newer image is a
  # change of its own, its build checked like any other. uam 1.1.0 with Mesa's fix of a multisample fetch's registers
  # and of a uniform vector's run-time component, scarletnx/uam, is built here (tools/uam.sh)
  nro:
    name: NRO (devkitA64)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      # the commit built: a pull request's head, else the commit pushed
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The commit itself, not a pull request's merge with main: the NRO names the commit it was built from (git
      # describe, docs/Versions.md), and a report from it names that commit. Its whole history, for the version tags
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # The container's root reads a checkout the runner's user owns, which git refuses: the build would name itself
      # "unknown"
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Every file is named after the commit's VERSION and the commit, 0.18.0-0123abc (docs/Releases.md); a VERSION
      # that is no version would name them wrong, and stops here as it stops the publish
      - name: Name the builds
        id: name
        run: |
          version=$(cat VERSION)
          [[ $version =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::VERSION holds \"$version\", not a version"; exit 1; }
          echo "stem=$version-${SHA::7}" >> "$GITHUB_OUTPUT"
      # A version's tag names the VERSION it is built with: the NRO says that version, the release the tag's
      - name: Check the tag against VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cat VERSION)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::$GITHUB_REF_NAME is tagged, VERSION says $version"; exit 1; }
      # The shaders that fetch a multisample texture through a handle are built by the fixed uam (tools/uam.sh):
      # its build, kept between runs while its script stays the same, and what builds it when it changes
      - name: Keep the fixed uam
        id: uam
        uses: actions/cache@v6
        with:
          path: |
            build/uam/uam
            build/uam/uam.stamp
          key: uam-${{ hashFiles('tools/uam.sh') }}
      - name: Install what builds uam
        if: steps.uam.outputs.cache-hit != 'true'
        run: |
          apt-get update > /dev/null
          apt-get install -y --no-install-recommends meson ninja-build bison flex python3-mako g++ > /dev/null
      - name: Build the NRO
        run: make -j"$(nproc)"
      # Each multisample fetch through a handle reads the handle where the console does: the order the fixed uam gives
      - name: Check the fetches' handle registers
        run: python3 tools/dksh-handles.py build/shaders/*.dksh
      # The build names this commit, clean, described from a version tag or alone: what a report opens with and the
      # folder it sits in, so a report can be matched with its source
      - name: Check the NRO names its commit
        run: |
          cat build/version.h
          hash=$(sed -n 's/^#define AMBERLITH_HASH "\(.*\)"$/\1/p' build/version.h)
          build=$(sed -n 's/^#define AMBERLITH_BUILD "\(.*\)"$/\1/p' build/version.h)
          case $hash in
            ''|*-dirty|unknown) echo "::error::the build names its commit \"$hash\""; exit 1 ;;
          esac
          [ "${SHA#"$hash"}" != "$SHA" ] || { echo "::error::the build names $hash, not $SHA"; exit 1; }
          case $build in
            "$hash"|v[0-9]*-g"$hash") ;;
            v[0-9]*) [ "$(git rev-parse -q --verify "refs/tags/$build^{commit}")" = "$SHA" ] ||
                { echo "::error::the build calls itself $build, a tag not on $SHA"; exit 1; } ;;
            *) echo "::error::the build calls itself \"$build\", not from a version tag or $hash"; exit 1 ;;
          esac
      # A machine that answers a game's SDK functions itself takes the program's by these symbols (docs/Hooks.md)
      - name: Check the NRO exports the SDK functions sdk.h declares
        run: python3 tools/sdk-exports.py amberlith.elf
      # A runtime that runs NVN itself takes a function when a call of the lookup returns it: each lookup has to be
      # a call through a pointer, which a compiler that can tell the target turns into a call by name
      - name: Check the NRO looks its NVN up through pointers
        run: python3 tools/nvn-lookups.py amberlith.elf
      # The probe as a Switch 2 program (docs/Ounce.md): the ExeFS builds, its descriptor is a Switch 2's, and it looks
      # its NVN up through pointers as the NRO does
      - name: Build the Switch 2 ExeFS
        run: make -f ounce.mk -j"$(nproc)"
      - name: Check the ExeFS is a Switch 2 program's
        run: |
          python3 tools/npdm-ounce.py read amberlith-ounce/exefs/main.npdm | grep -x 'descriptor: Switch 2, its magic at 0x300'
          python3 tools/nvn-lookups.py amberlith-ounce.elf
      # The probe as a mod of a game (docs/Mod.md): the module builds, asks of a game only what mod/imports.txt
      # lists, exports nothing and holds nothing of libnx's start
      - name: Build the mod of a game and check what it asks of the game
        run: make -f mod.mk -j"$(nproc)" check
      # The mod's zooms run through a game's NVN: their programs, compiled for NVN's layout (uam --nvn), read the
      # driver's banks only where NVN's driver writes them
      - name: Check the mod's programs read NVN's banks
        run: python3 tools/dksh-banks.py build-mod/shaders/*.dksh
      # A release holds the three (publish.yml): the Switch 2 program and the mod name the build the NRO names
      - name: Check the Switch 2 program and the mod name the NRO's build
        run: |
          for made in build-ounce/version.h build-mod/version.h; do
            cmp -s build/version.h "$made" || { echo "::error::$made is not build/version.h"; diff build/version.h "$made"; exit 1; }
          done
      - name: Name the NRO after its version and commit
        run: cp amberlith.nro "amberlith-${{ steps.name.outputs.stem }}.nro"
      # Each ExeFS folder zipped as exefs/ and its files, which go whole into a program's or a game's mod's folder
      - name: Zip the Switch 2 program and the mod, named after the version and the commit
        run: |
          for made in ounce mod; do
            (cd "amberlith-$made" && python3 -m zipfile -c "../amberlith-$made-${{ steps.name.outputs.stem }}.zip" exefs)
            python3 -m zipfile -l "amberlith-$made-${{ steps.name.outputs.stem }}.zip"
          done
      # Not zipped: the artifact is the NRO itself, named after its version and commit, and each ExeFS its zip
      - uses: actions/upload-artifact@v7
        with:
          path: amberlith-${{ steps.name.outputs.stem }}.nro
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: amberlith-ounce-${{ steps.name.outputs.stem }}.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: amberlith-mod-${{ steps.name.outputs.stem }}.zip
          archive: false
          if-no-files-found: error

  # The APK (docs/Android.md) with the runner's Gradle, JDK 21 and SDK, and the NDK and CMake it names, which the
  # runner's image may not carry (sdkmanager's download sometimes ends early: tried 3 times, 5 s apart). Named, as the
  # NRO, after the version and the commit it was built from
  apk:
    name: APK (Android)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The commit itself and its whole history, for the version tags the build describes itself from, as the NRO's
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # Every file is named after the commit's VERSION and the commit, 0.18.0-0123abc (docs/Releases.md); a VERSION
      # that is no version would name them wrong, and stops here as it stops the publish
      - name: Name the builds
        id: name
        run: |
          version=$(cat VERSION)
          [[ $version =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::VERSION holds \"$version\", not a version"; exit 1; }
          echo "stem=$version-${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Install the NDK and CMake
        run: |
          for try in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - name: Build the APK
        run: JAVA_HOME=$JAVA_HOME_21_X64 gradle -p android assembleDebug -Pamberlith.out="$RUNNER_TEMP/apk"
      # The library names this commit, clean, as the NRO's version.h does: what a report from it opens with
      - name: Check the APK names its commit
        run: |
          set -euo pipefail
          apk=$RUNNER_TEMP/apk/gradle/outputs/apk/debug/amberlith-debug.apk
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libamberlith.so' | tee "$RUNNER_TEMP/libs.txt"
          [ "$(wc -l < "$RUNNER_TEMP/libs.txt")" = 2 ] || { echo "::error::the APK lacks an ABI's libamberlith.so"; exit 1; }
          hash=$(git describe --always --dirty --abbrev=7 --exclude='*')
          case $hash in ''|*-dirty) echo "::error::the build names its commit \"$hash\""; exit 1 ;; esac
          unzip -p "$apk" lib/arm64-v8a/libamberlith.so | grep -aq "$hash" ||
            { echo "::error::libamberlith.so does not name $hash"; exit 1; }
          cp "$apk" "amberlith-${{ steps.name.outputs.stem }}.apk"
      # Not zipped: the artifact is the APK itself, named after it
      - uses: actions/upload-artifact@v7
        with:
          path: amberlith-${{ steps.name.outputs.stem }}.apk
          archive: false
          if-no-files-found: error

  # The judge, the screens and the tools' tests on the machine itself (docs/Build.md), and the tests of
  # .github/scripts: a nightly is published only when they pass
  host:
    name: Host tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run them
        run: make -f host.mk -j"$(nproc)" host-run

  # A pull request's NRO and APK, linked from a comment on it that each run rewrites, as soon as they are built
  # (.github/scripts/pr-builds.sh). A pull request from a fork gets a token that may not write, so it gets none
  links:
    name: Links to the builds
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [nro, apk]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/pr-builds.sh
          sparse-checkout-cone-mode: false
      - name: Link the builds from the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pr-builds.sh "$GITHUB_REPOSITORY" "$PR" "$GITHUB_RUN_ID" "$SHA"
